# Tactia — deploy de produção mínimo (um host, docker compose).
#
#   cp .env.example .env.production   # e preencha os valores reais
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.production up -d --build
#
# Portas: web (3000) e admin/ops (3001). Postgres e MinIO ficam na rede interna.
# Coloque um proxy com TLS (Caddy/nginx/ALB) na frente: host do produto → 3000,
# host do backoffice → 3001.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tactia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2023-03-20T20-16-18Z
    restart: unless-stopped
    # Imagens recentes exigem x86-64-v2; nesta VPS (KVM sem SSSE3/SSE4.2)
    # usamos release antiga + entrypoint direto no binário Go.
    entrypoint: ['minio']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'minio', '--version']
      interval: 30s
      timeout: 5s
      retries: 3

  # Aplica as migrations e sai. O web só sobe depois que este serviço termina.
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?defina BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?defina BETTER_AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?defina NEXT_PUBLIC_APP_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}
      OBJECT_STORAGE: ${OBJECT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-tactia}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      CRON_SECRET: ${CRON_SECRET:-}
      FIGRANIUM_INSTANCES_JSON: ${FIGRANIUM_INSTANCES_JSON:-{}}
      BROWSER_RUNTIME_URL: http://browser-runtime:8765
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:?defina BROWSER_RUNTIME_TOKEN}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      TRELLO_OAUTH_CLIENT_ID: ${TRELLO_OAUTH_CLIENT_ID:?defina TRELLO_OAUTH_CLIENT_ID}
      TRELLO_OAUTH_CLIENT_SECRET: ${TRELLO_OAUTH_CLIENT_SECRET:?defina TRELLO_OAUTH_CLIENT_SECRET}
      TRELLO_OAUTH_REDIRECT_URI: ${TRELLO_OAUTH_REDIRECT_URI:?defina TRELLO_OAUTH_REDIRECT_URI}
      TRELLO_CALLBACK_BASE_URL: ${TRELLO_CALLBACK_BASE_URL:?defina TRELLO_CALLBACK_BASE_URL}
      TRELLO_PLUGIN_ID: ${TRELLO_PLUGIN_ID:-}
      TRELLO_APP_SECRET: ${TRELLO_APP_SECRET:-}
    volumes:
      - uploads_data:/data/uploads
    networks:
      - default
      - browser_control
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  landing:
    build:
      context: ..
      dockerfile: docker/Dockerfile.landing
      args:
        PUBLIC_SITE_URL: ${LANDING_SITE_URL:-}
    restart: unless-stopped
    ports:
      - '${LANDING_BIND:-127.0.0.1}:${LANDING_PORT:-3002}:80'
    environment:
      LANDING_TRUSTED_PROXY: ${LANDING_TRUSTED_PROXY:-127.0.0.1}
    depends_on:
      web:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APP_PACKAGE: '@tactia/admin'
        APP_DIR: apps/admin
        APP_PORT: '3001'
    restart: unless-stopped
    ports:
      - '${ADMIN_PORT:-3001}:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL}
      ADMIN_AUTH_SECRET: ${ADMIN_AUTH_SECRET:?defina ADMIN_AUTH_SECRET}
      ADMIN_AUTH_URL: ${ADMIN_AUTH_URL:?defina ADMIN_AUTH_URL}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:?defina NEXT_PUBLIC_ADMIN_URL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?defina ENCRYPTION_KEY}
      TRELLO_OAUTH_CLIENT_ID: ${TRELLO_OAUTH_CLIENT_ID:?defina TRELLO_OAUTH_CLIENT_ID}
      TRELLO_OAUTH_CLIENT_SECRET: ${TRELLO_OAUTH_CLIENT_SECRET:?defina TRELLO_OAUTH_CLIENT_SECRET}
      TRELLO_OAUTH_REDIRECT_URI: ${TRELLO_OAUTH_REDIRECT_URI:?defina TRELLO_OAUTH_REDIRECT_URI}
      TRELLO_CALLBACK_BASE_URL: ${TRELLO_CALLBACK_BASE_URL:?defina TRELLO_CALLBACK_BASE_URL}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OBJECT_STORAGE: ${OBJECT_STORAGE:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-tactia}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      FIGRANIUM_INSTANCES_JSON: ${FIGRANIUM_INSTANCES_JSON:-{}}
      # Chat de teste do operador (/tenants/{id}/chat): mesmo LLM do web.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  figranium-torge:
    image: ghcr.io/figranium/figranium:0.18.4
    restart: unless-stopped
    environment:
      PORT: 11345
      NODE_ENV: production
      SESSION_SECRET: ${FIGRANIUM_SESSION_SECRET:?defina FIGRANIUM_SESSION_SECRET}
      ALLOWED_IPS: ${FIGRANIUM_ALLOWED_IPS:-}
      SKIP_LOCAL_CAPTCHA_MODEL: "true"
    ports:
      - '127.0.0.1:${FIGRANIUM_PORT:-11345}:11345'
    volumes:
      - figranium_torge_data:/app/data
      - figranium_torge_captures:/app/public/captures
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:11345/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  browser-runtime:
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    restart: unless-stopped
    environment:
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:?defina BROWSER_RUNTIME_TOKEN}
      BROWSER_EGRESS_URL: http://browser-egress:8888
      BROWSER_MAX_SESSIONS: ${BROWSER_MAX_SESSIONS:-2}
    networks:
      - browser_control
    depends_on:
      - browser-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 2g

  browser-egress:
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    command: ['python', '-m', 'app.egress']
    restart: unless-stopped
    environment:
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:?defina BROWSER_RUNTIME_TOKEN}
    networks:
      - browser_control
      - browser_outbound
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
  minio_data:
  uploads_data:
  figranium_torge_data:
  figranium_torge_captures:

networks:
  browser_control:
    internal: true
  browser_outbound:
