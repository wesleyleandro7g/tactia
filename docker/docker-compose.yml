services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tactia
      POSTGRES_PASSWORD: tactia
      POSTGRES_DB: tactia
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tactia -d tactia"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tactia
      MINIO_ROOT_PASSWORD: tactia-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tactia tactia-minio-secret; do sleep 1; done;
      mc mb --ignore-existing local/tactia;
      exit 0;
      "
    restart: "no"

  figranium-torge:
    image: ghcr.io/figranium/figranium:0.18.4
    profiles: ["browser-integrations"]
    restart: unless-stopped
    environment:
      PORT: 11345
      # Compose interpolates variables from inactive profiles too. Keep this
      # optional here so core services (for example postgres) can start alone.
      SESSION_SECRET: ${FIGRANIUM_SESSION_SECRET:-}
      ALLOWED_IPS: ${FIGRANIUM_ALLOWED_IPS:-}
      SKIP_LOCAL_CAPTCHA_MODEL: "true"
    ports:
      - "127.0.0.1:11345:11345"
    volumes:
      - figranium_torge_data:/app/data
      - figranium_torge_captures:/app/public/captures
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:11345/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  browser-runtime:
    profiles: ["browser-automation"]
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    environment:
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:-local-browser-runtime-token}
      BROWSER_EGRESS_URL: http://browser-egress:8888
      BROWSER_TEST_LOCAL: "true"
    networks:
      - browser_control
    depends_on:
      - browser-egress

  browser-runtime-gateway:
    profiles: ["browser-automation"]
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    command: ["python", "-m", "app.gateway"]
    ports:
      - "127.0.0.1:8765:8765"
    networks:
      - default
      - browser_control
    depends_on:
      - browser-runtime

  browser-egress:
    profiles: ["browser-automation"]
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    command: ["python", "-m", "app.egress"]
    environment:
      BROWSER_RUNTIME_TOKEN: ${BROWSER_RUNTIME_TOKEN:-local-browser-runtime-token}
      BROWSER_TEST_LOCAL: "true"
    networks:
      - browser_control
      - browser_outbound

  browser-test:
    profiles: ["browser-automation"]
    build:
      context: ..
      dockerfile: services/browser-runtime/Dockerfile
    command: ["python", "-m", "app.test_site"]
    networks:
      - browser_outbound

volumes:
  postgres_data:
  minio_data:
  figranium_torge_data:
  figranium_torge_captures:

networks:
  browser_control:
    internal: true
  browser_outbound:
