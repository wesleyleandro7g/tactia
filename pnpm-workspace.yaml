packages:
  - "apps/*"
  - "packages/*"

strictDepBuilds: false

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  better-sqlite3: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.69'
  - '@ai-sdk/openai@4.0.52'
  - '@ai-sdk/provider-utils@5.0.34'
  - '@ai-sdk/provider@4.0.9'
  - ai@7.0.85
